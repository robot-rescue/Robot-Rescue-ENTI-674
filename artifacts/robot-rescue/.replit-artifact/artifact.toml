kind = "web"
previewPath = "/"
title = "Robot Rescue"
version = "1.0.0"
id = "artifacts/robot-rescue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22694

[services.development]
run = "pnpm --filter @workspace/robot-rescue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/robot-rescue", "run", "build" ]
publicDir = "artifacts/robot-rescue/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22694"
BASE_PATH = "/"

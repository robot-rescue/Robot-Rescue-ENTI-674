kind = "web"
previewPath = "/"
title = "Robot Rescue"
version = "1.0.0"
id = "artifacts/robot-rescue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22694

[services.development]
run = "pnpm --filter @workspace/robot-rescue run dev"

[services.env]
PORT = "22694"
BASE_PATH = "/"

[services.production]
build = ["sh", "-c", "PORT=3000 BASE_PATH=/ pnpm --filter @workspace/robot-rescue run build"]
run = ["sh", "-c", "PORT=3000 pnpm --filter @workspace/robot-rescue run serve"]
